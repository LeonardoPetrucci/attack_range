general:
  attack_range_password: changeme123!
  cloud_provider: hyperv
  attack_range_name: ar
  description: Hyper-V deployment with Splunk and an Ubuntu 22.04 Linux endpoint

hyperv:
  hyperv_host: 192.168.1.1
  vswitch_name: "Default Switch"
  memory_mb: 4096

attack_range:
- name: splunk
  image: ubuntu-22.04
  instance_type: local
  ip_last_octet: 10
  linux: true
  user_name: ubuntu
  roles:
  - role: P4T12ICK.ludus_ar_splunk
    vars:
      ludus_ar_splunk_password: changeme123!
  - role: P4T12ICK.ar_guacamole
    vars:
      ar_guacamole_password: changeme123!
      ar_guacamole_servers:
        - name: splunk
          protocol: ssh
          hostname: 10.0.2.10
          port: 22
          username: ubuntu
          password: changeme123!
        - name: linux
          protocol: ssh
          hostname: 10.0.2.20
          port: 22
          username: ubuntu
          password: changeme123!
- name: linux
  image: ubuntu-22.04
  instance_type: local
  ip_last_octet: 20
  linux: true
  user_name: ubuntu
  roles:
  - role: P4T12ICK.ar_linux_endpoint
    vars:
      ar_linux_endpoint_splunk_ip: 10.0.2.10
      ar_linux_endpoint_password: changeme123!
