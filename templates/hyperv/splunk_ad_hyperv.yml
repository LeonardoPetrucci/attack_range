general:
  attack_range_password: changeme123!
  cloud_provider: hyperv
  attack_range_name: ar
  description: Hyper-V deployment with Splunk, Windows Active Directory domain controller, and domain-joined Windows endpoint

hyperv:
  hyperv_host: 192.168.1.1
  vswitch_name: "Default Switch"
  memory_mb: 4096

attack_range:
- name: splunk
  image: ubuntu-22.04
  instance_type: local
  ip_last_octet: 10
  linux: true
  user_name: ubuntu
  roles:
  - role: P4T12ICK.ludus_ar_splunk
    vars:
      ludus_ar_splunk_password: changeme123!
  - role: P4T12ICK.ar_guacamole
    vars:
      ar_guacamole_password: changeme123!
      ar_guacamole_servers:
        - name: splunk
          protocol: ssh
          hostname: 10.0.2.10
          port: 22
          username: ubuntu
          password: changeme123!
        - name: win-dc
          protocol: rdp
          hostname: 10.0.2.11
          port: 3389
          username: Administrator
          password: changeme123!
        - name: win
          protocol: rdp
          hostname: 10.0.2.12
          port: 3389
          username: Administrator
          password: changeme123!
- name: win-dc
  image: windows-server-2022
  instance_type: local
  ip_last_octet: 11
  windows: true
  user_name: Administrator
  roles:
  - role: P4T12ICK.ludus_ar_windows
    vars:
      ludus_ar_windows_password: changeme123!
      ludus_ar_windows_splunk_ip: 10.0.2.10
  - role: P4T12ICK.ar_domain_controller
    vars:
      ar_domain_controller_password: changeme123!
- name: win
  image: windows-server-2022
  instance_type: local
  ip_last_octet: 12
  windows: true
  user_name: Administrator
  roles:
  - role: P4T12ICK.ludus_ar_windows
    vars:
      ludus_ar_windows_password: changeme123!
      ludus_ar_windows_splunk_ip: 10.0.2.10
  - role: P4T12ICK.ar_domain_join
    vars:
      ar_domain_join_password: changeme123!
      ar_domain_join_domain_controller_ip: 10.0.2.11
