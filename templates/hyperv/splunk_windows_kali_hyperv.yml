# Splunk Attack Range - Hyper-V Local
# Template: Splunk + Windows AD + Kali attacker
# Host requirements: 30 GB RAM, 15 vCPU free
general:
  attack_range_password: Changeme1!
  cloud_provider: hyperv
  attack_range_name: ar
  description: "Hyper-V range: Splunk + Windows AD + Kali attacker (full purple team)"

hyperv:
  switch_wan:  CR-WAN
  switch_mgmt: CR-MGMT
  switch_ips1: CR-IPS1
  switch_ips2: CR-IPS2
  nat_name:    AR-NAT
  host_wan_ip: 10.10.10.1
  host_mgmt_ip: 172.16.100.2
  subnet_mgmt: 172.16.100.0/24
  subnet_targets: 172.16.101.0/24

attack_range:
- name: splunk
  os: linux
  box: bento/ubuntu-22.04
  ip_last_octet: 10
  memory_mb: 8192
  cpus: 4
  roles:
  - role: P4T12ICK.ludus_ar_splunk
    vars:
      ludus_ar_splunk_password: Changeme1!
  - role: P4T12ICK.ar_guacamole
    vars:
      ar_guacamole_password: Changeme1!
      ar_guacamole_servers:
        - name: splunk
          protocol: ssh
          hostname: 172.16.100.10
          port: 22
          username: vagrant
          password: Changeme1!
        - name: win-dc
          protocol: rdp
          hostname: 172.16.101.11
          port: 3389
          username: Administrator
          password: Changeme1!
        - name: kali
          protocol: ssh
          hostname: 172.16.101.50
          port: 22
          username: kali
          password: Changeme1!
- name: win-dc
  os: windows
  box: gusztavvargadr/windows-server-2022-standard-core
  ip_last_octet: 11
  memory_mb: 6144
  cpus: 2
  roles:
  - role: P4T12ICK.ludus_ar_windows
    vars:
      ludus_ar_windows_password: Changeme1!
      ludus_ar_windows_splunk_ip: 172.16.100.10
  - role: P4T12ICK.ar_domain_controller
    vars:
      ar_domain_controller_password: Changeme1!
- name: win
  os: windows
  box: gusztavvargadr/windows-server-2022-standard-core
  ip_last_octet: 12
  memory_mb: 4096
  cpus: 2
  roles:
  - role: P4T12ICK.ludus_ar_windows
    vars:
      ludus_ar_windows_password: Changeme1!
      ludus_ar_windows_splunk_ip: 172.16.100.10
  - role: P4T12ICK.ar_domain_join
    vars:
      ar_domain_join_password: Changeme1!
      ar_domain_join_domain_controller_ip: 172.16.101.11
- name: kali
  os: linux
  box: kalilinux/rolling
  ip_last_octet: 50
  memory_mb: 4096
  cpus: 2
  roles:
  - role: P4T12ICK.ludus_ar_kali
    vars:
      ludus_ar_kali_password: Changeme1!
